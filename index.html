<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#102942" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PREPA Futsal" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=20260816-v641" />
  <title>PREPA Futsal · v6.4.1 Elegant</title>
</head>
<body>
  <div id="appShell">
    <header class="topbar">
      <div class="brand">
        <div class="eyebrow">PREPA</div>
        <h1>Futsal</h1>
        <div class="appSub">Entrena · registra · progresa</div>
      </div>
      <div class="topActions">
        <select id="userSelect" class="userSelect" aria-label="Usuario"></select>
        <button id="todayBtn" class="iconBtn" aria-label="Ir a hoy">HOY</button>
      </div>
    </header>

    <main id="main" class="content"></main>

    <nav class="bottomNav" aria-label="Navegación principal">
      <button data-view="today" class="navBtn active"><span>🏋️</span><small>Hoy</small></button>
      <button data-view="calendar" class="navBtn"><span>📅</span><small>Plan</small></button>
      <button data-view="stats" class="navBtn"><span>📈</span><small>Progreso</small></button>
      <button data-view="motivation" class="navBtn"><span>🔥</span><small>Motivación</small></button>
      <button data-view="backup" class="navBtn"><span>⚙️</span><small>Datos</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <input id="importInput" type="file" accept=".xlsx,.xls,.xlsm,.json,.csv,text/csv,application/json" hidden />
  <input id="backupInput" type="file" accept=".json,application/json" hidden />

  <script src="data.js?v=20260816-v641"></script>
  <script src="app.js?v=20260816-v641"></script>
</body>
</html>
